services:
  - type: web
    name: gbam-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /matchmake/
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_ORIGIN
        sync: false
